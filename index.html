<html lang="en">
<head>

  <title>Basket Stories — Grocery Research</title>
  <meta name="description" content="Independent academic research about grocery and quick-commerce shopping habits.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600;700&family=Hind:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #241A2D;
      --plum: #2B174F;
      --plum-2: #43236E;
      --paper: #FFF8F0;
      --surface: #FFFFFF;
      --coral: #E4572E;
      --coral-soft: #FFE1D7;
      --mint: #1B998B;
      --mint-soft: #DDF4F0;
      --gold: #F2C14E;
      --muted: #5E5467;
      --line: #D8CCD9;
      --danger: #B42318;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: 'Atkinson Hyperlegible','Hind','Noto Sans Telugu',sans-serif; font-size: 18px; line-height: 1.5; }
    body.lang-hi { font-family: 'Hind','Atkinson Hyperlegible',sans-serif; }
    body.lang-te { font-family: 'Noto Sans Telugu','Atkinson Hyperlegible',sans-serif; }
    button, input, textarea { font: inherit; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--plum); color: white; box-shadow: 0 3px 0 rgba(36,26,45,.15); }
    .brand { font-family: 'Crimson Pro',serif; font-size: 1.45rem; font-weight: 700; letter-spacing: .01em; }
    .lang-toggle { display: flex; gap: 6px; }
    .lang-toggle button { min-width: 44px; min-height: 44px; padding: 7px 10px; border: 2px solid rgba(255,255,255,.75); border-radius: 999px; background: transparent; color: white; cursor: pointer; font-weight: 700; }
    .lang-toggle button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    .progress-track { height: 5px; background: #E8DDED; }

    main { display: flex; justify-content: center; padding: 28px 16px 110px; }

    .hint { margin: 0 0 22px; color: var(--muted); }
    .intro-mark { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 14px; border-radius: 18px; background: var(--gold); color: var(--plum); font-family: 'Crimson Pro',serif; font-size: 2.1rem; font-weight: 700; box-shadow: 6px 6px 0 var(--plum); }
    .option-list { display: flex; flex-direction: column; gap: 12px; }
    .option { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 52px; padding: 15px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; box-shadow: 0 3px 0 rgba(43,23,79,.08); transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease; }
    .option:hover { border-color: var(--plum-2); transform: translateY(-1px); box-shadow: 0 5px 0 rgba(43,23,79,.12); }

    .option .mark { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 24px; width: 24px; height: 24px; margin-top: 1px; border: 2px solid var(--plum); border-radius: 50%; color: white; font-size: .85rem; font-weight: 700; }
    .option.checkbox .mark { border-radius: 6px; }
    .option.selected .mark { background: var(--coral); border-color: var(--coral); }
    .option-copy { display: flex; flex: 1; align-items: center; justify-content: space-between; gap: 12px; }
    .study-focus { display: inline-flex; flex: 0 0 auto; align-items: center; padding: 4px 9px; border: 1px solid var(--plum-2); border-radius: 999px; background: var(--mint-soft); color: #126C63; font-size: .78rem; font-weight: 700; line-height: 1.2; white-space: nowrap; }

    textarea { min-height: 150px; resize: vertical; }
    textarea:focus, input:focus, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .field-note { margin-top: 7px; color: var(--muted); font-size: .9rem; }
    .error { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--danger); background: #FDE8E7; color: var(--danger); }
    .bottom { position: fixed; right: 0; bottom: 0; left: 0; z-index: 9; display: flex; justify-content: center; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: rgba(255,248,240,.95); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
    .bottom-inner { display: flex; justify-content: space-between; gap: 12px; width: 100%; max-width: 520px; }
    .nav-btn { min-width: 120px; min-height: 48px; padding: 12px 20px; border: 2px solid var(--plum); border-radius: 999px; background: var(--plum); color: white; cursor: pointer; font-weight: 700; box-shadow: 0 3px 0 #160B2A; }
    .nav-btn.secondary { background: var(--surface); color: var(--plum); box-shadow: none; }
    .nav-btn:disabled { cursor: wait; opacity: .6; }
    .success { padding: 26px; border: 2px solid var(--mint); border-radius: 18px; background: var(--mint-soft); }
    .success h1 { color: #126C63; }
    .consent { display: flex; align-items: flex-start; gap: 12px; margin-top: 22px; padding: 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
    .consent input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--coral); }
    .hidden { display: none !important; }
    .mic-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .mic-btn { min-height: 44px; padding: 8px 12px; border: 2px solid var(--plum); border-radius: 999px; background: var(--surface); color: var(--plum); cursor: pointer; font-weight: 700; }
    .mic-btn.listening { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); }
    @media (min-width: 700px) { main { padding-top: 48px; } .card { max-width: 600px; } h1 { font-size: 2.5rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
